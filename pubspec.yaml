name: attendence
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Supabase
  supabase_flutter: ^2.9.1
  
  # Networking & API
  json_annotation: ^4.9.0
  http: ^1.6.0
  
  # Location & Geofencing
  geolocator: ^12.0.0
  geofence_service: ^6.0.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.3
  
  # Biometrics & Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6
  
  # Camera & ML
  camera: ^0.10.5+5
  google_mlkit_face_detection: ^0.12.0
  image: ^4.3.0
  image_picker: ^1.0.7
  
  # Charts & Graphs (Modern, maintained packages only)
  fl_chart: ^0.66.2
  syncfusion_flutter_charts: ^29.2.11
  graphic: ^2.5.0
  
  # Calendar
  table_calendar: ^3.0.9
  
  # QR & NFC
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  nfc_manager: ^3.3.0
  
  # File Handling
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  pdf: ^3.10.7
  open_filex: ^4.4.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0
  shimmer: ^3.0.0
  lottie: ^3.1.3
  smooth_page_indicator: ^1.2.0+3
  cached_network_image: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  
  # Utilities
  intl: any
  path: ^1.9.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  logger: ^2.5.0
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.2
  dartz: ^0.10.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  dio: ^5.9.2
  
  # Communication & Real-time
  socket_io_client: ^2.0.3+1
  web_socket_channel: ^2.4.0
  
  # Video/Audio Calls
  agora_rtc_engine: ^6.3.2
  
  # PDF & Documents
  printing: ^5.12.0
  
  # Biometrics (additional)
  flutter_face_api: ^8.2.1103
  
  # Background Tasks
  workmanager: ^0.9.0+3
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  
  # Additional Enterprise Features
  go_router: ^14.0.0
  flutter_webrtc: ^0.12.1
  google_generative_ai: ^0.4.0
  flutter_quill: ^11.5.0
  flutter_downloader: ^1.11.1
  syncfusion_flutter_calendar: ^29.2.11
  flutter_reorderable_grid_view: ^4.0.0
  pusher_channels_flutter: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

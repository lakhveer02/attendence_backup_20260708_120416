version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: attendence
      POSTGRES_USER: attendence
      POSTGRES_PASSWORD: attendence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://attendence:attendence@postgres:5432/attendence
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:
